# Also pull from Rakuten Travel's official rankings (genres: all, onsen, premium).
use_rankings: true
ranking_genres: [onsen, premium]

# Only post places that are well reviewed.
min_review_average: 4.2
min_review_count: 50

# Don't repost the same hotel within this many days.
repost_after_days: 120

# Claude model used to write the hook + details.
model: claude-haiku-5-5   # cheapest; change to claude-sonnet-5-5 for punchier writing

# Threads counts some characters as bytes, so keep the reply tight.
# If a post is rejected for length, the bot trims and retries automatically.
max_details_chars: 170
