name: Post to Threads

on:
  schedule:
    # Candidate time slots (UTC). Each day bot/schedule.py picks 2-5 of them,
    # mostly lunch and after work, so post count and times change daily.
    - cron: "30 22 * * *"   # 07:30 JST
    - cron: "30 1 * * *"   # 10:30 JST
    - cron: "40 2 * * *"   # 11:40 JST
    - cron: "20 3 * * *"   # 12:20 JST
    - cron: "55 3 * * *"   # 12:55 JST
    - cron: "30 6 * * *"   # 15:30 JST
    - cron: "10 9 * * *"   # 18:10 JST
    - cron: "50 9 * * *"   # 18:50 JST
    - cron: "30 10 * * *"   # 19:30 JST
    - cron: "15 11 * * *"   # 20:15 JST
    - cron: "20 12 * * *"   # 21:20 JST
    - cron: "30 13 * * *"   # 22:30 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (don't post)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Is this slot in today's plan?
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 -m bot.schedule "${{ github.event.schedule }}"
          else
            python3 -m bot.schedule
          fi

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.post == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.plan.outputs.post == 'true'
        run: pip install -r requirements.txt

      - name: Random delay (0-20 min) so posts never land on the same minute
        if: steps.plan.outputs.post == 'true' && github.event_name == 'schedule'
        run: sleep $(( RANDOM % 1200 ))

      - name: Configure git
        if: steps.plan.outputs.post == 'true'
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"

      - name: Find, write and post
        if: steps.plan.outputs.post == 'true'
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_ALLOWED_SITE: ${{ vars.RAKUTEN_ALLOWED_SITE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python -m bot.main

      - name: Save post history
        if: always() && steps.plan.outputs.post == 'true'
        run: |
          git pull --rebase --autostash || true
          git add data/posted.json
          git diff --cached --quiet || (git commit -m "post history" && git push)
