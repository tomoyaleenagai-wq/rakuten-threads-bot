name: Post to Threads

on:
  schedule:
    # 5 posts a day (times are UTC → JST): 07:40, 12:10, 17:50, 20:20, 22:40 JST
    - cron: "40 22 * * *"
    - cron: "10 3 * * *"
    - cron: "50 8 * * *"
    - cron: "20 11 * * *"
    - cron: "40 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (don't post)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Random delay so posts don't land at the exact same minute
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 900 ))

      - name: Configure git
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"

      - name: Find, write and post
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_ALLOWED_SITE: ${{ vars.RAKUTEN_ALLOWED_SITE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python -m bot.main

      - name: Save post history
        if: always()
        run: |
          git pull --rebase --autostash || true
          git add data/posted.json data/queue.csv 2>/dev/null || git add data/posted.json
          git diff --cached --quiet || (git commit -m "post history" && git push)
