name: Fill upcoming hotels list

# Adds hotels to data/queue.csv so you can paste in your a.r10.to short links.
on:
  schedule:
    - cron: "0 11 * * 0"   # every Sunday 20:00 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Top up the list
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_ALLOWED_SITE: ${{ vars.RAKUTEN_ALLOWED_SITE }}
        run: python -m bot.upcoming
      - name: Save list
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data/queue.csv
          git diff --cached --quiet || (git commit -m "upcoming hotels list" && git push)

